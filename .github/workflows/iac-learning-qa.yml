name: Maa Sati IAC Learning Workflow QA
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'scripts/validate-iac-site.mjs'
      - 'scripts/test-learning-stages.mjs'
      - 'scripts/validate-launch-readiness.mjs'
      - 'scripts/verify-public-http.mjs'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'vercel.json'
      - '.github/workflows/iac-learning-qa.yml'
  pull_request:
    paths:
      - '*.html'
      - 'scripts/validate-iac-site.mjs'
      - 'scripts/test-learning-stages.mjs'
      - 'scripts/validate-launch-readiness.mjs'
      - 'scripts/verify-public-http.mjs'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'vercel.json'
      - '.github/workflows/iac-learning-qa.yml'
  workflow_dispatch:
    inputs:
      public_http_check:
        description: "Check publicly accessible HTTPS pages (enable only after launch access is approved)"
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node --version
      - name: Check page scripts and navigation
        run: node scripts/validate-iac-site.mjs
      - name: Test learner progress states
        run: node scripts/test-learning-stages.mjs
      - name: Validate public/private launch files
        run: node scripts/validate-launch-readiness.mjs
      - name: Optional public HTTPS smoke check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.public_http_check }}
        run: node scripts/verify-public-http.mjs
